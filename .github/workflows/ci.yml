name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build FuryEngine.sln -c Release --nologo
      - name: Test
        run: dotnet test FuryEngine.sln -c Release --no-build --nologo
